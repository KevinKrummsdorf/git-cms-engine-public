services:
  cms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      
      # Database connection
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cms_db}"
      CMS_DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cms_db}"
      CMS_DB_SCHEMA: "${CMS_DB_SCHEMA:-cms}"
      
      # Storage paths
      CMS_RAW_DATA_PATH: "/app/raw_data"
      CMS_PROCESSED_DATA_PATH: "/app/data"
      
      # Git & Sync configuration
      CMS_USE_LOCAL_CONTENT: "${CMS_USE_LOCAL_CONTENT:-False}"
      CMS_GIT_URL: "${CMS_GIT_URL:-https://github.com/your-username/your-docs-repo}"
      CMS_GIT_PAT: "${CMS_GIT_PAT:-}"
      CMS_GIT_BRANCH: "${CMS_GIT_BRANCH:-main}"
      CMS_SYNC_SECRET: "${CMS_SYNC_SECRET:-changeme}"

    volumes:
      - cms_raw_data:/app/raw_data
      - cms_data:/app/data

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cms-network

  postgres:
    image: postgres:15-alpine
    container_name: cms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-cms_db}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

volumes:
  postgres_data:
  cms_data:
  cms_raw_data:

networks:
  cms-network:
    driver: bridge
